[package]
name = "packobf_gui"
version = "0.3.0-beta.3"
edition = "2024"
license = "MIT"

[dependencies]
packobf = { path = "../packobf" }
tokio = { version = "1.54", features = ["sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.10", features = ["v4_10"] }

[features]
default = []
ffi = []
profiling = ["packobf/profiling"]
