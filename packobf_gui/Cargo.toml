[package]
name = "packobf_gui"
version = "0.3.0"
edition = "2024"
license = "MIT"

[dependencies]

tokio = { version = "1.53" }

arboard = "3"

packobf = { path = "../packobf" }

cxx = "1"

cxx-qt = "0.8.1"
cxx-qt-lib = {version = "0.8.1", features = ["full"]}

[build-dependencies]
cxx-qt-build = { version = "0.8.1", features = [ "link_qt_object_files" ] }

[features]
default = []
profiling = ["packobf/profiling"]
