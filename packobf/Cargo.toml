[package]
name = "packobf"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.118"
zip = "8.5.1"
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
once_cell = "1.21.4"
oxipng = { version = "10.1.0", default-features = false, features = ["freestanding", "zopfli"] }
dashmap = "6.1.0"
glsl-lang = "0.8.1"
smol_str = "0.3.6"
byteorder = "1.5.0"
crc32fast = "1.5.0"
sha2 = "0.11.0"
zopfli = "0.8.3"
libdeflater = { version = "1.25.2", default-features = false, features = ["freestanding"] }
phf = { version = "0.13.1", features = ["macros"] }
optivorbis = "0.3.0"
regex = "1.12.3"
image = "0.25.10"
strum = "0.28.0"
strum_macros = "0.28.0"
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3.95"
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1"
zune-png = "0.5.2"

[build-dependencies]
phf_codegen = "0.13.1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
