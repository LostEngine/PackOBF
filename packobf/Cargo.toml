[package]
name = "packobf"
version = "0.3.0-beta.3"
edition = "2021"
license = "MIT"

[dependencies]
zip = "9"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
once_cell = "1.21"
oxipng = { version = "10.2.1" }
dashmap = { version = "6.2", features = ["rayon"] }
tokio = { version = "1.54", features = ["full"] }
glsl-lang = "0.8.1"
smol_str = "0.3.6"
byteorder = "1.5"
sha2 = "0.11"
rayon = "1.12"
libdeflater = "1.26"
phf = { version = "0.14", features = ["macros"] }
optivorbis = "0.3"
regex = "1.13"
clap = { version = "4.6", features = ["derive"] }
strum = "0.28"
strum_macros = "0.28"
arc-swap = "1"
dhat = { version = "0.3", optional = true }
fxhash = "0.2"

[build-dependencies]
phf_codegen = "0.14"

[features]
default = []
profiling = []
dhat-heap = ["dep:dhat"]

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
cloned_instead_of_copied = "warn"
expl_impl_clone_on_copy = "warn"
float_cmp_const = "warn"
if_not_else = "warn"
ignored_unit_patterns = "warn"
linkedlist = "warn"
manual_let_else = "warn"
map_flatten = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
mem_forget = "warn"
missing_const_for_fn = "warn"
mut_mut = "warn"
mutex_integer = "warn"
needless_continue = "warn"
option_if_let_else = "warn"
path_buf_push_overwrite = "warn"
range_plus_one = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_semicolon = "warn"
unseparated_literal_suffix = "warn"
use_self = "warn"
useless_let_if_seq = "warn"
