[package]
name = "packobf"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
zip = "8.5.1"
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
once_cell = "1.21.4"
oxipng = { version = "10.1.0", features = ["zopfli"] }
dashmap = { version = "6.1.0", features = ["rayon"] }
tokio = { version = "1.52.1", features = ["full"] }
glsl-lang = "0.8.1"
smol_str = "0.3.6"
byteorder = "1.5.0"
crc32fast = "1.5.0"
sha2 = "0.11.0"
rayon = "1.12.0"
zopfli = "0.8.3"
libdeflater = "1.25.2"
phf = { version = "0.13.1", features = ["macros"] }
optivorbis = "0.3.0"
regex = "1.12.3"
stb_image = "0.3.0"
image = "0.25.10"
clap = { version = "4.6.1", features = ["derive"] }
strum = "0.28.0"
strum_macros = "0.28.0"
arc-swap = "1"

[build-dependencies]
phf_codegen = "0.13.1"

[features]
default = []
profiling = []

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
