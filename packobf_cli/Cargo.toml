[package]
name = "packobf_cli"
version = "0.3.0"
edition = "2024"
license = "MIT"
default-run = "packobf_cli"

[dependencies]
packobf = { path = "../packobf" }
clap = { version = "4.6.6", features = ["derive"] }
tokio = "1.53.1"
indicatif = "0.18.6"
console = "0.16.4"

[features]
default = []
profiling = ["packobf/profiling"]
