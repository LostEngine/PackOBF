name: Build

on:
  push:
    paths-ignore:
      - 'README.md'
    branches: [ "main" ]
  pull_request:
    paths-ignore:
      - 'README.md'
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  license:
    name: Generate License
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Cache LICENSE.md
        id: cache-license
        uses: actions/cache@v4
        with:
          path: LICENSE.md
          key: license-${{ hashFiles('Cargo.lock', 'about.hbs', 'about.toml') }}

      - name: Install cargo-about
        if: steps.cache-license.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Generate LICENSE.md
        if: steps.cache-license.outputs.cache-hit != 'true'
        run: |
          cargo about generate about.hbs | perl -0777 -pe 's/\s+$/\n/' | tee -a LICENSE.md > /dev/null

      - name: Upload LICENSE.md
        uses: actions/upload-artifact@v4
        with:
          name: generated-license
          path: LICENSE.md
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    needs: license
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64 GNU
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
            cli: packobf_cli
            java-lib: librust.so

          # Linux x64 MUSL
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: linux-x86_64-musl
            cli: packobf_cli
            java-lib: librust.so

          # Linux ARM64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            artifact: linux-aarch64
            cli: packobf_cli
            java-lib: librust.so

          # macOS Intel
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-x86_64
            cli: packobf_cli
            java-lib: librust.dylib

          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-aarch64
            cli: packobf_cli
            java-lib: librust.dylib

          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
            cli: packobf_cli.exe
            java-lib: rust.dll

          # Windows ARM64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: windows-aarch64
            cli: packobf_cli.exe
            java-lib: rust.dll
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-${{ matrix.os }}-${{ matrix.target }}"

      - name: Install cross (linux-x86_64-musl and linux-aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'x86_64-unknown-linux-musl'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        if: matrix.target != 'aarch64-unknown-linux-gnu' && matrix.target != 'x86_64-unknown-linux-musl'
        run: cargo build --release --target ${{ matrix.target }} -p packobf_cli -p rust

      - name: Build (linux-aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }} -p packobf_cli -p rust

      - name: Build (linux-x86_64-musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cross build --release --target ${{ matrix.target }} -p packobf_cli

      - name: Download LICENSE.md
        uses: actions/download-artifact@v4
        with:
          name: generated-license

      - name: Prepare CLI Executable
        # Always make sure files that are published contain the license files
        run: |
          rm -rf dist && mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.cli }} dist/
          cp LICENSE.md dist/

      - name: Upload CLI Executable
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.artifact }}
          path: dist/*

      - name: Prepare Java Native Library
        if: matrix.target != 'x86_64-unknown-linux-musl'
        run: |
          rm -rf dist && mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.java-lib }} dist/
          cp LICENSE.md dist/

      - name: Upload Java Native Library
        if: matrix.target != 'x86_64-unknown-linux-musl'
        uses: actions/upload-artifact@v4
        with:
          name: java-lib-${{ matrix.artifact }}
          path: dist/*

  buildGui:
    name: Build GUI (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    needs: license
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x86_64
          - os: macos-26-intel
            artifact: macos-x86_64
            mac-arch: x86_64
          - os: macos-26
            artifact: macos-aarch64
            mac-arch: arm64
          - os: windows-2025
            artifact: windows-x86_64
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-gui-${{ matrix.os }}"
          workspaces: |
            .
            . -> packobf_gui/target
            . -> packobf_gui/target/macos-rust

      - name: Download LICENSE.md
        uses: actions/download-artifact@v4
        with:
          name: generated-license

      - name: Install GTK and libadwaita
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev

      - name: Prepare GTK frontend
        if: runner.os == 'Linux'
        run: |
          cargo build --locked --release -p packobf_gui
          mkdir -p dist
          cp target/release/packobf_gui dist/
          cp LICENSE.md dist/

      - name: Package SwiftUI frontend
        if: runner.os == 'macOS'
        run: |
          bash packobf_gui/platforms/macos/build.sh release
          mkdir -p dist dmg
          ditto "packobf_gui/target/macos/${{ matrix.mac-arch }}/release/PackOBF.app" dmg/PackOBF.app
          cp LICENSE.md dmg/
          hdiutil create -volname PackOBF -srcfolder dmg -format UDZO dist/packobf-gui-${{ matrix.artifact }}.dmg

      - name: Install .NET
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Package WinUI frontend
        if: runner.os == 'Windows'
        run: |
          dotnet publish packobf_gui/platforms/windows/PackOBF.Windows.csproj \
            -c Release -p:Platform=x64 -o dist \
            -p:EnableMsixTooling=true \
            -p:IncludeAllContentForSelfExtract=true \
            -p:PublishSingleFile=true \
            -p:DebugType=embedded
          test -f dist/PackOBF.exe
          test -f dist/packobf_gui.dll
          cp LICENSE.md dist/

      - name: Upload GUI
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  buildJava:
    name: Build Java Library
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup Java
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          cache: 'gradle'
      - name: Download Linux x64
        uses: actions/download-artifact@v4
        with:
          name: java-lib-linux-x86_64
          path: artifacts/native/linux-x86_64

      - name: Download Linux ARM64
        uses: actions/download-artifact@v4
        with:
          name: java-lib-linux-aarch64
          path: artifacts/native/linux-aarch64

      - name: Download macOS Intel
        uses: actions/download-artifact@v4
        with:
          name: java-lib-macos-x86_64
          path: artifacts/native/macos-x86_64

      - name: Download macOS ARM
        uses: actions/download-artifact@v4
        with:
          name: java-lib-macos-aarch64
          path: artifacts/native/macos-aarch64

      - name: Download Windows x64
        uses: actions/download-artifact@v4
        with:
          name: java-lib-windows-x86_64
          path: artifacts/native/windows-x86_64

      - name: Download Windows ARM
        uses: actions/download-artifact@v4
        with:
          name: java-lib-windows-aarch64
          path: artifacts/native/windows-aarch64
      - name: Copy native libraries
        run: |
          mkdir -p java/build/external-natives
          
          cp -r artifacts/native/linux-x86_64 java/build/external-natives/
          cp -r artifacts/native/linux-aarch64 java/build/external-natives/
          
          cp -r artifacts/native/macos-x86_64 java/build/external-natives/
          cp -r artifacts/native/macos-aarch64 java/build/external-natives/
          
          cp -r artifacts/native/windows-x86_64 java/build/external-natives/
          cp -r artifacts/native/windows-aarch64 java/build/external-natives/
      - name: Build
        run: |
          cd java
          ./gradlew build
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: java-package
          path: java/build/libs/*.jar
